name: time_miner
description: "Time miner description"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter  
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  collection: ^1.19.1
  flutter_svg: ^2.2.1
  logging: ^1.3.0
  shared_preferences: ^2.5.3
  dio: ^5.9.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.5
  package_info_plus: ^8.3.1
  cached_network_image: ^3.4.1
  flutter_dotenv: ^6.0.0
  sticky_headers: ^0.3.0+2

  # endregion

  # region Firebase packages
  firebase_core: ^4.1.0
  firebase_analytics: ^12.0.1
  firebase_crashlytics: ^5.0.1
  firebase_app_installations: ^0.4.0+1
  firebase_performance: ^0.11.0+1

  # endregion

  flutter_adaptive_scaffold: ^0.3.3+1
  path_provider: ^2.1.5
  http: ^1.5.0
  syncfusion_flutter_pdfviewer: ^31.1.17
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  permission_handler: ^12.0.1
  contacts_service: ^0.6.3


flutter_launcher_icons:
    android: true
    image_path: "assets/images/android_appicon.png"
    adaptive_icon_background: "#035C67"
    adaptive_icon_foreground: "assets/images/android_appicon.png"

flutter_native_splash:
  color: "#035C67"
  image: assets/images/background.png
  android: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    # Images assets
    - assets/images/

    # flutter_dotenv
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
